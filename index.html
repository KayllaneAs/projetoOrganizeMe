    let pessoas = {}; 
    function adicionarTarefa() {
    let pessoa = document.getElementById("pessoa").value.trim();
    let tarefa = document.getElementById("tarefa").value.trim();
    let dia = document.getElementById("dia").value;

    // verifica se está preenchido
    if (!pessoa || !tarefa) {
        alert("Preencha todos os campos!");
        return;
    }

    // Adicionar tarefa à pessoa e dia correspondente
    if (!pessoas[pessoa]) {
        pessoas[pessoa] = {}; 
    }
    if (!pessoas[pessoa][dia]) {
        pessoas[pessoa][dia] = []; 
    }

    pessoas[pessoa][dia].push(tarefa); 

    exibirTarefas(); // atualiza lista
}
